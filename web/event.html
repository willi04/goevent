    <script>
      // 1. Initialisation de la Navbar
      if (document.getElementById("navbar") && typeof btNavbar === "function") {
        document.getElementById("navbar").innerHTML = btNavbar("evenements");
      }
      if (typeof btMobileDrawerHeader === "function") {
        var hdrEl = document.getElementById("mobile-drawer-header");
        if (hdrEl) hdrEl.innerHTML = btMobileDrawerHeader();
      }
      if (typeof btMobileAuthSection === "function") {
        var ctaEl = document.getElementById("mobile-drawer-auth-cta");
        if (ctaEl) ctaEl.innerHTML = btMobileAuthSection();
      }
      // Bottom nav mobile (composant centralisé bt-api.js)
      if (typeof btMobileBottomNav === "function") {
        var bnEl = document.getElementById("bottom-nav-mobile");
        if (bnEl) bnEl.innerHTML = btMobileBottomNav("evenements"); // ← clé adaptée par page
      }
      if (typeof btMobileAuthSection === "function") {
        var authEl = document.getElementById("mobile-auth-section");
        if (authEl) authEl.innerHTML = btMobileAuthSection();
      }
      // Sections drawer (Aide + Support WhatsApp + Inviter un ami)
      if (typeof btMobileDrawerSections === "function") {
        var drawerSecEl = document.getElementById("mobile-drawer-sections");
        if (drawerSecEl) drawerSecEl.innerHTML = btMobileDrawerSections();
      }
      // 2. Gestion du menu mobile
      function toggleMobileMenu() {
        const menu = document.getElementById("mobile-menu");
        const drawer = document.getElementById("mobile-drawer");
        if (menu.classList.contains("hidden")) {
          menu.classList.remove("hidden");
          setTimeout(() => {
            menu.classList.remove("opacity-0");
            drawer.classList.remove("translate-x-full");
          }, 10);
        } else {
          menu.classList.add("opacity-0");
          drawer.classList.add("translate-x-full");
          setTimeout(() => {
            menu.classList.add("hidden");
          }, 300);
        }
      }
      // 3. Dessiner les cartes d'événements
     function renderDynamicEvents(events) {
        const container = document.getElementById("events-grid-container");
        if (!container) return;

        if (!events || events.length === 0) {
          container.innerHTML =
            '<p class="text-outline col-span-full py-12 text-center text-lg font-medium">Aucun événement ne correspond à votre recherche.</p>';
          return;
        }

        container.innerHTML = events
          .map((e) => {
            const dateObj = new Date(e.event_date);
            const isPast = dateObj < new Date(); 

            const prixFormate =
              typeof btPrice === "function"
                ? btPrice(e.price)
                : e.price > 0
                  ? e.price.toLocaleString("fr-FR") + " FCFA"
                  : "Gratuit";
            
            const dateString = dateObj
              .toLocaleDateString("fr-FR", {
                weekday: "short",
                day: "numeric",
                month: "short",
                hour: "2-digit",
                minute: "2-digit",
              })
              .replace(",", " •");

            // Design de la carte : on garde l'opacité réduite pour les événements passés
            const cardClass = isPast 
                ? "group bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm opacity-50 grayscale-[20%] transition-all duration-300 flex flex-col cursor-not-allowed" 
                : "group bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer flex flex-col";
            
            const clickAction = isPast 
                ? "" 
                : `onclick="window.location.href='event_detail.html?id=${e.id}'"`;

            // MODIFICATION ICI : Le badge "TERMINÉ" est maintenant en vert GoEvent
           // Badge "TERMINÉ" en vert GoEvent, panier normal sinon, "Complet" grisé si sold-out
            const btnHtml = isPast 
                ? `<div class="px-4 py-2 bg-primary text-white rounded-full font-black text-[15px] uppercase tracking-widest flex items-center gap-1 shadow-sm">
                     <span aria-hidden="true" class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1">history</span> TERMINE
                   </div>`
                : e.is_sold_out
                ? `<div class="px-4 py-2 bg-gray-200 text-gray-500 rounded-full font-black text-[12px] uppercase tracking-widest flex items-center gap-1 shadow-sm">
                     <span aria-hidden="true" class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1">block</span> Complet
                   </div>`
                : `<button onclick="event.stopPropagation(); window.location.href='event_detail.html?id=${e.id}'" aria-label="Réserver ${_btEscapeHtml(e.title)}" class="p-3 bg-primary/5 text-primary rounded-full hover:bg-primary hover:text-white transition-all shadow-sm active:scale-95">
                    <span aria-hidden="true" class="material-symbols-outlined">shopping_cart</span>
                  </button>`;

            // Badge "Mis en avant" pour les events boostés (Chantier 17)
            const boostBadge = (e.is_boosted && !isPast && !e.is_sold_out)
              ? `<div class="absolute top-4 right-4 bg-gradient-to-r from-orange-500 to-red-500 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider shadow-lg flex items-center gap-1">
                   <span aria-hidden="true" class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1">local_fire_department</span>
                   Mis en avant
                 </div>`
              : "";
            
            // Badge "Gratuit" P2 (si pas boosté, pas passé, pas complet)
            const isFree = !e.price || e.price === 0;
            const freeBadge = (isFree && !e.is_boosted && !isPast && !e.is_sold_out)
              ? `<div class="absolute top-4 right-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider shadow-lg flex items-center gap-1">
                   <span aria-hidden="true" class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1">card_giftcard</span>
                   Gratuit
                 </div>`
              : "";

            // Badge "COMPLET" (override boost + gratuit + bouton panier ; event reste cliquable)
            const soldOutBadge = (e.is_sold_out && !isPast)
              ? `<div class="absolute top-4 right-4 bg-gray-900/90 backdrop-blur text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider shadow-lg flex items-center gap-1">
                   <span aria-hidden="true" class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1">block</span>
                   Complet
                 </div>`
              : "";
            
            return `
            <div class="${cardClass}" ${clickAction}>
              <div class="relative h-48 overflow-hidden shrink-0">
                <img class="w-full h-full object-cover ${isPast ? '' : 'transition-transform duration-500 group-hover:scale-110'}" src="${_btEscapeHtml(e.cover_image_url || "https://via.placeholder.com/600x400?text=GoEvent")}" onerror="this.src='https://via.placeholder.com/600x400?text=GoEvent'" alt="${_btEscapeHtml(e.title)}" />
                <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-primary shadow-sm">
                  ${e.category || "Événement"}
                </div>
                ${boostBadge}
                ${freeBadge}
                ${soldOutBadge}
              </div>
              <div class="p-6 flex-1 flex flex-col">
                <div class="flex items-center gap-2 text-xs text-outline mb-2">
                  <span aria-hidden="true" class="material-symbols-outlined text-sm">calendar_today</span>
                  <span class="capitalize">${dateString}</span>
                </div>
                <h3 class="text-lg font-headline font-bold text-on-surface mb-3 leading-tight line-clamp-2">
                  ${_btEscapeHtml(e.title)}
                </h3>
                <div class="flex items-center gap-2 text-sm text-outline mb-6">
                  <span aria-hidden="true" class="material-symbols-outlined text-sm">location_on</span>
                  <span class="truncate">${_btEscapeHtml(e.location)}</span>
                </div>
                <div class="flex items-center justify-between mt-auto">
                 <span class="text-lg font-extrabold ${isPast ? 'text-gray-400 line-through' : 'text-secondary'}">${prixFormate}</span>
                  ${btnHtml}
                </div>
              </div>
            </div>
          `;
          })
          .join("");
      }
      // 4. LE CODE QUE TU M'AS ENVOYÉ (avec la pagination corrigée)
      document.addEventListener("DOMContentLoaded", async () => {
        const container = document.getElementById("events-grid-container");
        const countHeader = document.getElementById("events-count-header");

        // Filtres
        const searchInput = document.querySelector('input[type="text"]');
        const catCheckboxes = document.querySelectorAll(".cat-checkbox");
        const priceFilter = document.getElementById("price-filter");
        const priceDisplay = document.getElementById("price-display");
        const locationFilter = document.getElementById("location-filter");
        const includePastFilter = document.getElementById("include-past-filter");

        // Nouveaux venus : Tri et Pagination
        const sortSelect = document.getElementById("sort-select");
        const paginationContainer = document.getElementById(
          "pagination-container",
        );

        // Variables d'état
        let currentPage = 1;
        const itemsPerPage = 6; // Combien de cartes on affiche par page

        async function fetchAndRenderEvents() {
          if (container) container.style.opacity = "0.5";

          try {
            const params = new URLSearchParams();

            // Ajout de la page, limite et tri
            params.append("page", currentPage);
            params.append("limit", itemsPerPage);
            if (sortSelect) params.append("sort_by", sortSelect.value);
            
            // Filtre temporel : par défaut on n'affiche que les futurs.
            // Si la checkbox est cochée, on élargit aux 30 derniers jours.
            if (includePastFilter && includePastFilter.checked) {
              params.append("include_past_days", "30");
            } else {
              params.append("upcoming_only", "true");
            }
                        if (searchInput && searchInput.value.trim() !== "") {
              params.append("q", searchInput.value.trim());
            }
            const checkedCats = Array.from(catCheckboxes)
              .filter((cb) => cb.checked)
              .map((cb) => cb.value);
            if (checkedCats.length > 0) {
              params.append("categories", checkedCats.join(","));
            }
            if (priceFilter && priceFilter.value < 100000) {
              params.append("max_price", priceFilter.value);
            }
            if (locationFilter && locationFilter.value !== "") {
              params.append("location", locationFilter.value);
            }

            // Appel API
            const url = "/events?" + params.toString();
            const response = await btApi.get(url);

            // La réponse est maintenant un objet avec .events et .total
            const events = response.events;
            const total = response.total;

            // 1. Titre
            if (countHeader) {
              if (
                params.toString().includes("q=") ||
                params.toString().includes("categories=") ||
                params.toString().includes("max_price=") ||
                params.toString().includes("location=")
              ) {
                countHeader.textContent =
                  total +
                  (total > 1 ? " événements trouvés" : " événement trouvé");
              } else {
                countHeader.textContent = "Tous nos événements";
              }
            }

            // 2. Grille d'événements
            renderDynamicEvents(events);

            // 3. Dessiner la pagination
            renderPagination(total);
          } catch (error) {
            console.error("Erreur :", error);
          } finally {
            if (container) container.style.opacity = "1";
          }
        }

        // --- LE MOTEUR DE PAGINATION (Avec TON design) ---
        function renderPagination(total) {
          if (!paginationContainer) return;
          const totalPages = Math.ceil(total / itemsPerPage);

          if (totalPages <= 1) {
            paginationContainer.innerHTML = ""; // Cache la pagination s'il n'y a qu'une page
            return;
          }

          let html = "";

          // Bouton Précédent (chevron_left)
          html += `<button onclick="changePage(${currentPage - 1})" class="w-12 h-12 rounded-xl border border-outline-variant flex items-center justify-center hover:bg-surface-container-high transition-colors disabled:opacity-30 disabled:cursor-not-allowed" ${currentPage === 1 ? "disabled" : ""} aria-label="Précédent">
                        <span aria-hidden="true" class="material-symbols-outlined">chevron_left</span>
                     </button>`;

          // Les numéros (1, 2, 3...)
          for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage) {
              html += `<button class="w-12 h-12 rounded-xl bg-primary text-white font-bold">${i}</button>`;
            } else {
              html += `<button onclick="changePage(${i})" class="w-12 h-12 rounded-xl border border-outline-variant flex items-center justify-center hover:bg-surface-container-high font-bold transition-colors">${i}</button>`;
            }
          }

          // Bouton Suivant (chevron_right)
          html += `<button onclick="changePage(${currentPage + 1})" class="w-12 h-12 rounded-xl border border-outline-variant flex items-center justify-center hover:bg-surface-container-high transition-colors disabled:opacity-30 disabled:cursor-not-allowed" ${currentPage === totalPages ? "disabled" : ""} aria-label="Suivant">
                        <span aria-hidden="true" class="material-symbols-outlined">chevron_right</span>
                     </button>`;

          paginationContainer.innerHTML = html;
        }

        // Fonction globale pour changer de page
        window.changePage = function (newPage) {
          currentPage = newPage;
          fetchAndRenderEvents();
          // Remonte doucement en haut de la liste quand on change de page
          if (countHeader)
            countHeader.scrollIntoView({ behavior: "smooth", block: "start" });
        };

        // --- ECOUTEURS (Quand on touche à un filtre, on retourne à la page 1) ---
        function updateFilters() {
          currentPage = 1;
          fetchAndRenderEvents();
        }

        let searchTimeout = null;
        if (searchInput) {
          searchInput.addEventListener("input", () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(updateFilters, 400);
          });
        }
        catCheckboxes.forEach((cb) =>
          cb.addEventListener("change", updateFilters),
        );
        if (locationFilter)
          locationFilter.addEventListener("change", updateFilters);
        if (sortSelect) sortSelect.addEventListener("change", updateFilters);
        if (includePastFilter) {
          includePastFilter.addEventListener("change", updateFilters);
        }
        if (priceFilter) {
          priceFilter.addEventListener(
            "input",
            (e) =>
              (priceDisplay.textContent =
                Number(e.target.value).toLocaleString("fr-FR") + " FCFA"),
          );
          priceFilter.addEventListener("change", updateFilters);
        }
        const urlParams = new URLSearchParams(window.location.search);
        const searchFromUrl = urlParams.get("search");
        if (searchFromUrl && searchInput) {
          searchInput.value = searchFromUrl;
        }
        // Chargement initial
        await fetchAndRenderEvents();
      });
      document.getElementById("footer").innerHTML = btFooter();
    </script>
    <script src="pwa.js"></script>
  </body>
</html>
