    <script src="bt-api.js?v=20261101"></script>
    <script>
      // 1. Initialisation de la Navbar
      if (document.getElementById("navbar") && typeof btNavbar === "function") {
        document.getElementById("navbar").innerHTML = btNavbar("evenements");
      }
      if (typeof btMobileDrawerHeader === "function") {
        var hdrEl = document.getElementById("mobile-drawer-header");
        if (hdrEl) hdrEl.innerHTML = btMobileDrawerHeader();
      }
      if (typeof btMobileAuthSection === "function") {
        var ctaEl = document.getElementById("mobile-drawer-auth-cta");
        if (ctaEl) ctaEl.innerHTML = btMobileAuthSection();
      }
      // Bottom nav mobile (composant centralisé bt-api.js)
      if (typeof btMobileBottomNav === "function") {
        var bnEl = document.getElementById("bottom-nav-mobile");
        if (bnEl) bnEl.innerHTML = btMobileBottomNav("evenements"); // ← clé adaptée par page
      }
      // Liens du tiroir (composant centralisé bt-api.js, même liste que la navbar)
      if (typeof btMobileDrawerLinks === "function") {
        var dlEl = document.getElementById("mobile-drawer-links");
        if (dlEl) dlEl.innerHTML = btMobileDrawerLinks("evenements");
      }
      if (typeof btMobileAuthSection === "function") {
        var authEl = document.getElementById("mobile-auth-section");
        if (authEl) authEl.innerHTML = btMobileAuthSection();
      }
      // Sections drawer (Aide + Support WhatsApp + Inviter un ami)
      if (typeof btMobileDrawerSections === "function") {
        var drawerSecEl = document.getElementById("mobile-drawer-sections");
        if (drawerSecEl) drawerSecEl.innerHTML = btMobileDrawerSections();
      }
      // 2. Gestion du menu mobile
      function toggleMobileMenu() {
        const menu = document.getElementById("mobile-menu");
        const drawer = document.getElementById("mobile-drawer");
        if (menu.classList.contains("hidden")) {
          menu.classList.remove("hidden");
          setTimeout(() => {
            menu.classList.remove("opacity-0");
            drawer.classList.remove("translate-x-full");
          }, 10);
        } else {
          menu.classList.add("opacity-0");
          drawer.classList.add("translate-x-full");
          setTimeout(() => {
            menu.classList.add("hidden");
          }, 300);
        }
      }
      // 3. Liste des événements (lot 5) : catégories, filtres, « À la une », liste / grille, « Voir plus »
      (function () {
        var TZ = "Africa/Bangui", LIMIT = 12;
        var WHEN = [["", "Toutes les dates"], ["today", "Aujourd'hui"], ["weekend", "Ce week-end"], ["month", "Ce mois-ci"]];
        var PRICES = [["", "Tous les prix"], ["0", "Gratuit"], ["2000", "≤ 2 000 FCFA"], ["5000", "≤ 5 000 FCFA"],
                      ["10000", "≤ 10 000 FCFA"], ["25000", "≤ 25 000 FCFA"]];
        var SORTS = [["date_asc", "Les plus proches"], ["date_desc", "Les plus lointains"],
                     ["price_asc", "Prix croissant"], ["price_desc", "Prix décroissant"]];
        var F = { q: "", cat: "", when: "", price: "", city: "", free: false, past: false, sort: "date_asc" };
        var page = 1, total = 0, shown = 0, busy = false, seq = 0;
        var $ = function (id) { return document.getElementById(id); };
        var esc = function (s) { return typeof _btEscapeHtml === "function" ? _btEscapeHtml(s) : String(s || ""); };
        var grid = $("events-grid-container");

        function toDate(iso) { return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z"); }
        function dateLabel(iso) {
          var d = toDate(iso);
          var s = d.toLocaleDateString("fr-FR", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" }) +
            " · " + d.toLocaleTimeString("fr-FR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).replace(":", "h");
          return s.charAt(0).toUpperCase() + s.slice(1);
        }
        function price(p) { return p > 0 ? Math.round(p).toLocaleString("fr-FR") + " FCFA" : "Gratuit"; }
        function cover(e) { return esc(e.cover_image_url || "icons/event-default.svg"); }

        function card(e, header) {
          var past = toDate(e.event_date) < new Date();
          var badge = past ? '<span class="ev-b inline-flex bg-gray-900/85 text-white">Terminé</span>'
            : e.is_sold_out ? '<span class="ev-b inline-flex bg-gray-900/90 text-white">Complet</span>'
            : e.is_boosted ? '<span class="ev-b hidden md:inline-flex bg-gradient-to-r from-orange-500 to-red-500 text-white">À la une</span>' : "";
          return (header ? '<div>' + header : "<div>") +
            '<a href="event_detail.html?id=' + e.id + '" class="group flex gap-3 p-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm ' +
            'md:flex-col md:gap-0 md:p-0 md:overflow-hidden md:h-full hover:shadow-lg transition-shadow' + (past ? " opacity-75" : "") + '">' +
            '<div class="relative w-24 h-24 shrink-0 rounded-xl overflow-hidden bg-gray-100 md:w-full md:h-auto md:aspect-[16/10] md:rounded-none">' +
            '<img src="' + cover(e) + '" alt="" loading="lazy" class="w-full h-full object-cover md:group-hover:scale-105 transition-transform duration-500" ' +
            'onerror="this.onerror=null;this.src=\'icons/event-default.svg\'">' +
            '<span class="hidden md:inline-block absolute top-3 left-3 bg-white/95 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider text-primary">' +
            esc(e.category || "Événement") + "</span>" + (badge ? '<span class="absolute bottom-1 left-1 right-1 md:left-auto md:bottom-auto md:top-3 md:right-3 flex justify-center">' + badge + "</span>" : "") +
            "</div>" +
            '<div class="min-w-0 flex-1 flex flex-col py-0.5 md:p-4">' +
            '<p class="text-[11px] md:text-xs text-primary font-bold">' + dateLabel(e.event_date) + "</p>" +
            '<h3 class="font-headline font-bold text-[15px] md:text-base leading-tight line-clamp-2 text-on-surface mt-0.5">' + esc(e.title) + "</h3>" +
            '<p class="text-xs md:text-sm text-outline truncate mt-0.5"><span class="md:hidden">' + esc(e.category || "Événement") + " · </span>" + esc(e.location) + "</p>" +
            '<div class="mt-auto pt-1 md:pt-3 flex items-center justify-between"><span class="font-extrabold text-sm md:text-base ' +
            (e.price > 0 ? "text-secondary" : "text-primary") + '">' + price(e.price) + "</span>" +
            (past ? "" : '<span class="hidden md:inline text-xs font-bold text-primary">Réserver →</span>') + "</div></div></a></div>";
        }
        function groupHeader(label) {
          return '<p class="md:hidden text-[11px] font-bold text-outline uppercase tracking-widest pt-2 pb-2">' + label + "</p>";
        }
        function render(events, append) {
          var weekEnd = Date.now() + 7 * 86400000, grouped = F.sort === "date_asc" && !F.past, html = "";
          var lastGroup = append ? grid.getAttribute("data-group") : null;
          events.forEach(function (e) {
            var h = null;
            if (grouped) {
              var g = toDate(e.event_date).getTime() < weekEnd ? "Cette semaine" : "Plus tard";
              if (g !== lastGroup) { h = groupHeader(g); lastGroup = g; }
            }
            html += card(e, h);
          });
          if (grouped && lastGroup) grid.setAttribute("data-group", lastGroup); else grid.removeAttribute("data-group");
          if (append) grid.insertAdjacentHTML("beforeend", html); else grid.innerHTML = html;
          if (!grid.children.length) {
            grid.innerHTML = '<div class="col-span-full py-12 text-center"><span class="material-symbols-outlined text-5xl text-outline">event_busy</span>' +
              '<p class="text-on-surface font-bold mt-2">Aucun événement ne correspond.</p>' +
              '<button type="button" class="mt-3 text-primary font-bold underline" onclick="window.evReset()">Effacer les filtres</button></div>';
          } else if (typeof window.btZonesInfeed === "function") window.btZonesInfeed(grid);   // cartes « Sponsorisé »
        }

        // « À la une » : 3 boostés max (rotation serveur 5 min), seulement sans recherche ni filtre
        function une(list) {
          var box = $("ev-une");
          if (!list.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
          var tile = function (e, size, small) {
            return '<a href="event_detail.html?id=' + e.id + '" class="relative block rounded-3xl overflow-hidden shadow-md ' + size + '">' +
              '<img src="' + cover(e) + '" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.onerror=null;this.src=\'icons/event-default.svg\'">' +
              '<span class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></span>' +
              '<span class="absolute top-3 left-3 bg-gradient-to-r from-orange-500 to-red-500 text-white px-2.5 py-1 rounded-full text-[10px] font-black uppercase">À la une</span>' +
              '<span class="absolute bottom-0 left-0 right-0 p-4 md:p-5 text-white"><span class="block text-xs md:text-sm font-bold text-secondary-container">' + dateLabel(e.event_date) + "</span>" +
              '<span class="block font-headline font-extrabold text-lg leading-tight ' + (small ? "md:text-xl line-clamp-1" : "md:text-2xl line-clamp-2") + '">' + esc(e.title) + "</span>" +
              '<span class="block text-xs text-white/85 mt-1 truncate">' + (small ? "" : esc(e.location) + " · ") + "<b>" + price(e.price) + "</b></span></span></a>";
          };
          var mob = '<div class="md:hidden"><div id="ev-une-track" class="-mx-4 px-4 flex gap-3 overflow-x-auto snap-x snap-mandatory ev-noscroll">' +
            list.map(function (e) { return '<div class="snap-start shrink-0 ' + (list.length > 1 ? "w-[86%]" : "w-full") + '">' + tile(e, "h-48") + "</div>"; }).join("") + "</div>" +
            (list.length > 1 ? '<div class="flex justify-center gap-1.5 mt-2" id="ev-une-dots">' + list.map(function (_, i) {
              return '<span class="h-1.5 rounded-full transition-all ' + (i ? "w-1.5 bg-gray-300" : "w-5 bg-primary") + '"></span>'; }).join("") + "</div>" : "") + "</div>";
          var desk = list.length === 1 ? tile(list[0], "h-56")
            : list.length === 2 ? '<div class="grid grid-cols-2 gap-5">' + tile(list[0], "h-56") + tile(list[1], "h-56") + "</div>"
            : '<div class="grid grid-cols-[1.4fr_1fr] gap-5">' + tile(list[0], "h-72") + '<div class="grid grid-rows-2 gap-5">' + tile(list[1], "", true) + tile(list[2], "", true) + "</div></div>";
          box.innerHTML = mob + '<div class="hidden md:block">' + desk + "</div>";
          box.classList.remove("hidden");
          var track = $("ev-une-track"), dots = $("ev-une-dots");
          if (track && dots) track.addEventListener("scroll", function () {
            var i = Math.round(track.scrollLeft / (track.firstChild.getBoundingClientRect().width + 12));
            Array.prototype.forEach.call(dots.children, function (d, k) { d.className = "h-1.5 rounded-full transition-all " + (k === i ? "w-5 bg-primary" : "w-1.5 bg-gray-300"); });
          }, { passive: true });
        }
        function filtered() { return !!(F.q || F.cat || F.when || F.price || F.city || F.free || F.past); }

        function params(p) {
          var u = new URLSearchParams({ page: p, limit: LIMIT, sort_by: F.sort, boost_first: "false" });
          if (F.past) u.set("include_past_days", "30"); else u.set("upcoming_only", "true");
          if (F.q) u.set("q", F.q);
          if (F.cat) u.set("categories", F.cat);
          if (F.when) u.set("when", F.when);
          if (F.price === "0") u.set("free_only", "true"); else if (F.price) u.set("max_price", F.price);
          if (F.free) u.set("free_only", "true");
          if (F.city) u.set("location", F.city);
          return u.toString();
        }
        function header() {
          var h = $("events-count-header");
          h.textContent = total ? total + (filtered() ? (total > 1 ? " événements trouvés" : " événement trouvé")
            : (total > 1 ? " événements à venir" : " événement à venir")) : (filtered() ? "Aucun résultat" : "Aucun événement à venir");
          var more = $("ev-more"), prog = $("ev-progress");
          var left = total - shown;
          more.classList.toggle("hidden", left <= 0);
          more.textContent = "Voir " + Math.min(LIMIT, left) + " événement" + (Math.min(LIMIT, left) > 1 ? "s" : "") + " de plus";
          prog.textContent = total > LIMIT ? shown + " sur " + total : "";
          var n = ["when", "price", "city", "free", "past"].filter(function (k) { return F[k]; }).length, b = $("ev-filters-n");
          b.textContent = n; b.classList.toggle("hidden", !n);
        }
        function load(append) {
          var my = ++seq;
          if (!append) { page = 1; grid.style.opacity = "0.5"; }
          busy = true;
          return btApi.get("/events?" + params(page)).then(function (r) {
            if (my !== seq) return;
            total = r.total || 0;
            shown = append ? shown + r.events.length : r.events.length;
            render(r.events || [], append);
            header();
          }).catch(function () {
            if (my !== seq) return;
            $("events-count-header").textContent = "Connexion impossible";
            grid.innerHTML = '<div class="col-span-full py-12 text-center"><span class="material-symbols-outlined text-5xl text-outline">wifi_off</span>' +
              '<p class="font-bold mt-2">Impossible de charger les événements.</p><p class="text-sm text-outline">Vérifiez votre connexion.</p>' +
              '<button type="button" class="mt-4 px-5 py-2.5 rounded-full bg-primary text-white font-bold" onclick="window.evReload()">Réessayer</button></div>';
          }).then(function () { if (my === seq) { busy = false; grid.style.opacity = "1"; } });
        }
        function loadUne() {
          if (filtered()) { une([]); return; }
          btApi.get("/events?boosted_only=true&upcoming_only=true&limit=3").then(function (r) {
            if (!filtered()) une((r.events || []).slice(0, 3));
          }).catch(function () { une([]); });
        }
        function refresh() { load(false); loadUne(); syncControls(); }

        // ── Contrôles (ordinateur + panneau téléphone, état partagé) ──
        function chip(active, label) {
          return "shrink-0 whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold border transition-colors " +
            (active ? "bg-primary text-white border-primary" : "bg-white text-on-surface border-gray-200 hover:border-primary");
        }
        function catChips(list) {
          var box = $("ev-cats");
          box.innerHTML = [""].concat(list).map(function (c) {
            return '<button type="button" role="tab" data-cat="' + esc(c) + '" class="' + chip(F.cat === c) + '">' + esc(c || "Tout") + "</button>";
          }).join("");
        }
        function whenChips(id) {
          $(id).innerHTML = WHEN.map(function (w) {
            return '<button type="button" data-when="' + w[0] + '" class="' + chip(F.when === w[0]).replace("text-sm", "text-xs md:text-sm").replace("py-2", "py-1.5") + '">' + w[1] + "</button>";
          }).join("");
        }
        function options(id, list) { $(id).innerHTML = list.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + "</option>"; }).join(""); }
        function syncControls() {
          Array.prototype.forEach.call($("ev-cats").children, function (b) { b.className = chip(b.getAttribute("data-cat") === F.cat); });
          whenChips("ev-when-desk"); whenChips("ev-when-mob");
          ["desk", "mob"].forEach(function (k) {
            $("ev-price-" + k).value = F.price; $("ev-city-" + k).value = F.city;
            $("ev-free-" + k).checked = F.free; $("ev-past-" + k).checked = F.past;
          });
          $("ev-sort-desk").value = F.sort; $("ev-sort-mob").value = F.sort;
        }
        window.evReset = function () { F.cat = F.when = F.price = F.city = ""; F.free = F.past = false; F.q = ""; $("ev-search").value = ""; refresh(); };
        window.evReload = function () { refresh(); };

        options("ev-price-desk", PRICES); options("ev-price-mob", PRICES);
        options("ev-sort-desk", SORTS); options("ev-sort-mob", SORTS);
        $("ev-cats").addEventListener("click", function (ev) {
          var b = ev.target.closest("[data-cat]"); if (!b) return;
          F.cat = b.getAttribute("data-cat"); refresh();
        });
        ["ev-when-desk", "ev-when-mob"].forEach(function (id) {
          $(id).addEventListener("click", function (ev) {
            var b = ev.target.closest("[data-when]"); if (!b) return;
            F.when = b.getAttribute("data-when"); refresh();
          });
        });
        var t = null;
        function debounced(fn) { clearTimeout(t); t = setTimeout(fn, 400); }
        $("ev-search").addEventListener("input", function () { F.q = this.value.trim(); debounced(refresh); });
        ["desk", "mob"].forEach(function (k) {
          $("ev-price-" + k).addEventListener("change", function () { F.price = this.value; refresh(); });
          $("ev-city-" + k).addEventListener("input", function () { F.city = this.value.trim(); debounced(refresh); });
          $("ev-free-" + k).addEventListener("change", function () { F.free = this.checked; refresh(); });
          $("ev-past-" + k).addEventListener("change", function () { F.past = this.checked; refresh(); });
          $("ev-sort-" + k).addEventListener("change", function () { F.sort = this.value; refresh(); });
        });
        $("ev-more").addEventListener("click", function () { if (!busy) { page += 1; load(true); } });
        var sheet = $("ev-sheet");
        $("ev-filters-btn").addEventListener("click", function () { sheet.classList.remove("hidden"); sheet.classList.add("flex"); });
        sheet.addEventListener("click", function (ev) {
          if (ev.target === sheet || ev.target.closest("[data-close]")) { sheet.classList.add("hidden"); sheet.classList.remove("flex"); }
        });
        $("ev-reset").addEventListener("click", function () { window.evReset(); });

        // Pub latérale : la colonne n'apparaît (≥ 1280 px) que si l'emplacement a un bloc en ligne
        var sideZone = document.querySelector('#ev-side [data-zone]'), side = $("ev-side"), layout = $("ev-layout");
        function sideCheck() {
          var on = sideZone && !sideZone.classList.contains("hidden");
          side.className = on ? "hidden xl:block" : "hidden";
          layout.classList.toggle("xl:grid-cols-[300px_1fr]", !!on);
        }
        if (sideZone && "MutationObserver" in window) new MutationObserver(sideCheck).observe(sideZone, { attributes: true, attributeFilter: ["class"] });

        var url = new URLSearchParams(location.search);
        F.q = (url.get("search") || url.get("q") || "").trim();
        F.cat = (url.get("cat") || "").trim();
        $("ev-search").value = F.q;
        catChips([]);
        btApi.get("/categories").then(function (cats) {
          var list = (cats || []).map(function (c) { return c.category; }).slice(0, 12);
          if (F.cat && list.indexOf(F.cat) < 0) list.unshift(F.cat);
          catChips(list);
        }).catch(function () {});
        refresh();
      })();

      document.getElementById("footer").innerHTML = btFooter();
    </script>
    <script src="pwa.js"></script>
      <!-- Contenu éditable depuis le back-office (après bt-api.js : réutilise BT_API) -->
    <script src="cms.js?v=20261101" defer></script>
</body>
