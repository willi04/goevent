<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Scanner | GoEvent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="bt-api.js"></script>

    <style>
      body {
        font-family: "Manrope", sans-serif;
        background-color: #f3f3f3;
      }
      h1,
      h2,
      h3 {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      /* Personnalisation de la zone de scan */
      #reader {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        border-radius: 1.5rem;
        overflow: hidden;
        border: none !important;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      #reader video {
        border-radius: 1.5rem;
        object-fit: cover;
      }
    </style>
    <script src="auth-guard.js"></script>
  </head>
  <body class="min-h-screen flex flex-col p-4">
    <header
      class="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl shadow-sm border border-gray-100"
    >
      <h1
        id="scanner-title"
        class="text-lg font-black text-[#00502c] truncate flex-1 pr-4"
      >
        Contrôle d'accès
      </h1>

      <button
        onclick="logoutAgent()"
        class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-xl font-bold text-sm hover:bg-red-100 active:scale-95 transition-all shrink-0"
      >
        <span class="material-symbols-outlined" style="font-size: 20px"
          >logout</span
        >
        <span class="hidden sm:inline">Quitter</span>
      </button>
    </header>

    <!-- ════════════════════════════════════════════════════════ -->
    <!-- BANDEAU AFFLUENCE TEMPS RÉEL (refresh auto /30s)        -->
    <!-- ════════════════════════════════════════════════════════ -->
    <div
      id="scan-stats-card"
      class="mb-6 bg-gradient-to-br from-[#00502c] to-[#006b3c] rounded-2xl p-5 shadow-lg text-white relative overflow-hidden"
    >
      <!-- Barre de progression de fond (effet "remplissage") -->
      <div
        id="stats-progress-bar"
        class="absolute inset-y-0 left-0 bg-white/10 transition-all duration-700 ease-out"
        style="width: 0%"
      ></div>

      <div class="relative z-10">
        <!-- Ligne du haut : label + spinner -->
        <div class="flex justify-between items-center mb-2">
          <p class="text-[10px] font-bold uppercase tracking-widest text-white/70">
            Affluence en temps réel
          </p>
          <span
            id="stat-refresh-spinner"
            class="material-symbols-outlined text-white/60 text-base hidden"
            >sync</span
          >
        </div>

        <!-- Compteur principal : entered / expected + taux -->
        <div class="flex items-end justify-between gap-3">
          <p class="text-3xl md:text-4xl font-black leading-none tabular-nums">
            <span id="stat-entered">—</span>
            <span class="text-white/60 text-xl"> / </span>
            <span id="stat-expected" class="text-white/80 text-xl">—</span>
          </p>
          <span
            id="stat-rate"
            class="text-3xl md:text-4xl font-black tabular-nums leading-none"
            >—%</span
          >
        </div>

        <!-- Sous-ligne : reste à entrer -->
        <p class="text-xs text-white/70 font-bold mt-3">
          <span id="stat-remaining" class="text-base text-white font-black tabular-nums"
            >—</span
          >
          personnes restantes à entrer
        </p>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center relative">
      <div id="reader"></div>

      <p
        class="text-gray-500 text-sm mt-6 font-bold uppercase tracking-widest text-center"
      >
        Placez le QR Code du fan dans le cadre
      </p>

    <div
      id="scan-result"
      class="hidden absolute inset-0 z-50 bg-white/90 backdrop-blur-sm rounded-3xl flex-col items-center justify-center p-6 text-center transform transition-transform scale-95"
    >
      <div
        id="result-icon"
        class="w-24 h-24 rounded-full flex items-center justify-center mb-4 text-white shadow-lg"
      >
        <span
          class="material-symbols-outlined text-5xl"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >check_circle</span
        >
      </div>
      <h2
        id="result-status"
        class="text-3xl font-black mb-2 uppercase tracking-wide"
      >
        VALIDE
      </h2>
      
      <p id="result-fan" class="text-xl font-bold text-gray-800 mb-1">
        Nom du Fan
      </p>
      
      <p id="result-event" class="text-sm text-gray-500 font-medium mb-6">
        Titre de l'événement
      </p>
      <p id="result-reason" class="text-red-500 font-bold mb-6 hidden">
        Raison de l'erreur
      </p>
    
      <!-- Bouton standard (visible pour billet validé ou refusé) -->
      <button
        id="btn-next-scan"
        onclick="relancerScanner()"
        class="w-full py-4 rounded-full bg-gray-200 text-gray-800 font-bold text-lg hover:bg-gray-300 transition-colors"
      >
        Scanner le suivant
      </button>
    </div>
    <script>

      const currentUser = btAuth.getUser();
      let html5QrCode;

      // Variables globales : event_id courant + interval refresh
      let currentEventId = null;
      let statsRefreshInterval = null;

      document.addEventListener("DOMContentLoaded", async () => {
        // Garde auth (déplacée ici pour éviter race condition <head>)
        if (typeof requireAuth === "function") requireAuth(["agent"]);

        const pageTitle = document.getElementById("scanner-title");

        // Récupération du nom + ID de l'event courant
        try {
          const response = await btApi.get("/agent/current-event");
          if (pageTitle) {
            pageTitle.textContent = `Scanner - ${response.event_name}`;
          }
          document.title = `Scanner - ${response.event_name}`;
          // event_id : depuis la réponse OU depuis le user en localStorage (fallback)
          currentEventId = response.event_id || (btAuth.getUser() || {}).agent_event_id || null;
        } catch (error) {
          if (pageTitle)
            pageTitle.textContent = "Scanner - Contrôle des billets";
          // Tentative fallback uniquement via le user en localStorage
          currentEventId = (btAuth.getUser() || {}).agent_event_id || null;
        }

        // Lancer les stats temps réel si on a un event_id
        if (currentEventId) {
          loadScanStats();
          statsRefreshInterval = setInterval(loadScanStats, 30000); // /30s
        } else {
          // Pas d'event_id : cacher le bandeau (pas d'erreur visible à l'agent)
          const card = document.getElementById("scan-stats-card");
          if (card) card.classList.add("hidden");
        }

        // Préparation et allumage de la caméra
        html5QrCode = new Html5Qrcode("reader");
        demarrerScanner();
      });

      // ════════════════════════════════════════════════════════
      // STATS TEMPS RÉEL — refresh /30s + après chaque scan
      // ════════════════════════════════════════════════════════
      async function loadScanStats() {
        if (!currentEventId) return;

        const spinner = document.getElementById("stat-refresh-spinner");
        if (spinner) {
          spinner.classList.remove("hidden");
          spinner.style.animation = "spin 1s linear infinite";
        }

        try {
          const stats = await btApi.get(`/tickets/scan/stats/${currentEventId}`);

          const entered = stats.total_entered ?? 0;
          const expected = stats.total_confirmed ?? 0;
          const remaining = stats.total_remaining ?? 0;
          const rate = stats.entry_rate_pct ?? 0;

          const setText = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
          };

          setText("stat-entered", entered.toLocaleString("fr-FR"));
          setText("stat-expected", expected.toLocaleString("fr-FR"));
          setText("stat-remaining", remaining.toLocaleString("fr-FR"));
          setText("stat-rate", `${Math.round(rate)}%`);

          // Barre de progression de fond
          const progressBar = document.getElementById("stats-progress-bar");
          if (progressBar) {
            const pct = expected > 0 ? Math.min(100, (entered / expected) * 100) : 0;
            progressBar.style.width = pct + "%";
          }
        } catch (err) {
          console.warn("Erreur chargement stats:", err);
          // On garde les anciennes valeurs affichées (pas de flash "—")
        } finally {
          if (spinner) {
            spinner.classList.add("hidden");
            spinner.style.animation = "";
          }
        }
      }

      function demarrerScanner() {
        // Configuration : 10 images par seconde, zone de scan carrée
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        // On force l'utilisation de la caméra arrière ("environment")
        html5QrCode
          .start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure,
          )
          .catch((err) => {
            console.error("Erreur d'accès à la caméra :", err);
            btToast(
              "Impossible d'accéder à la caméra. Vérifiez les permissions.",
              "error",
            );
            // Afficher un bouton de récupération
            const reader = document.getElementById("reader");
            if (reader) {
              reader.innerHTML = `
                <div class="bg-red-50 border-2 border-red-200 rounded-3xl p-8 text-center">
                  <span class="material-symbols-outlined text-red-500 text-6xl mb-3">videocam_off</span>
                  <p class="font-bold text-red-700 mb-4">Caméra inaccessible</p>
                  <p class="text-sm text-red-600 mb-4">Vérifiez que vous avez autorisé l'accès à la caméra dans les paramètres de votre navigateur.</p>
                  <button onclick="window.location.reload()" class="px-6 py-3 bg-red-500 text-white rounded-full font-bold hover:bg-red-600 active:scale-95 transition-all">
                    Réessayer
                  </button>
                </div>
              `;
            }
          });
      }

      // 4. Le cœur du système : Que se passe-t-il quand un QR est détecté ?
      async function onScanSuccess(decodedText, decodedResult) {
        // Feedback haptic + sonore pour agent en environnement bruyant
        try {
          if (navigator.vibrate) navigator.vibrate(100);
          // Bip audio léger (Web Audio API)
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = 800;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {
          // Pas de feedback dispo : on continue silencieusement
        }
        // On met la caméra en pause
        html5QrCode.pause(true);
      
        const resultModal = document.getElementById("scan-result");
        const iconDiv = document.getElementById("result-icon");
        const statusEl = document.getElementById("result-status");
        const fanEl = document.getElementById("result-fan");
        const eventEl = document.getElementById("result-event");
        const reasonEl = document.getElementById("result-reason");
        const btnNextScan = document.getElementById("btn-next-scan");
      
        // Reset l'affichage
        reasonEl.classList.add("hidden");
        btnNextScan.classList.remove("hidden");
      
        try {
          const response = await btApi.post("/scan", { qr_data: decodedText });
      
          if (response.valid === true) {
            // ✅ SUCCÈS : Billet payé et validé
            iconDiv.className =
              "w-24 h-24 rounded-full flex items-center justify-center mb-4 text-white shadow-lg bg-green-500";
            iconDiv.innerHTML =
              '<span class="material-symbols-outlined text-5xl" style="font-variation-settings: \'FILL\' 1">check_circle</span>';
            
            statusEl.textContent = "ACCÈS AUTORISÉ";
            statusEl.className =
              "text-3xl font-black mb-2 uppercase tracking-wide text-green-600";
      
            fanEl.textContent = response.message 
              ? response.message.replace("Validé ! ", "").replace(" peut entrer.", "") 
              : "Client vérifié";
            eventEl.textContent = response.event || "Événement";
          }
          
        } catch (error) {
          // ❌ ÉCHEC : Faux billet ou déjà utilisé
          iconDiv.className =
            "w-24 h-24 rounded-full flex items-center justify-center mb-4 text-white shadow-lg bg-red-500";
          iconDiv.innerHTML =
            '<span class="material-symbols-outlined text-5xl" style="font-variation-settings: \'FILL\' 1">cancel</span>';
          
          statusEl.textContent = "REFUSÉ";
          statusEl.className =
            "text-3xl font-black mb-2 uppercase tracking-wide text-red-600";
      
          fanEl.textContent = "Billet Invalide";
          reasonEl.textContent =
            error.message || error.detail || "Ce QR Code n'est pas reconnu.";
          reasonEl.classList.remove("hidden");
        }
      
        // On affiche la modale
        resultModal.classList.remove("hidden");
        resultModal.classList.add("flex");
      }
      
      function relancerScanner() {
        document.getElementById("scan-result").classList.add("hidden");
        document.getElementById("scan-result").classList.remove("flex");
        html5QrCode.resume();
        // Refresh immédiat des stats après scan (sans attendre les 30s)
        if (typeof loadScanStats === "function") loadScanStats();
      }
      function onScanFailure(error) {
        // Cette fonction tourne en boucle tant qu'aucun QR code n'est trouvé.
        // On la laisse vide pour ne pas polluer la console du navigateur.
      }

      // 5. Permettre à l'Agent de finir sa journée
      async function logoutAgent() {
        const confirmed = confirm(
          "⚠️ ATTENTION\n\n" +
          "Quitter va SUPPRIMER DÉFINITIVEMENT votre compte agent.\n" +
          "Vous ne pourrez plus scanner avec ce compte.\n\n" +
          "Si l'événement n'est pas terminé, fermez simplement l'onglet (votre session reste active 24h).\n\n" +
          "Êtes-vous sûr de vouloir terminer définitivement ?"
        );
        if (!confirmed) return;
        clearInterval(statsRefreshInterval);
        
        const btn = document.querySelector('button[onclick="logoutAgent()"]');
        if (btn)
          btn.innerHTML =
            '<span class="material-symbols-outlined">hourglass_empty</span> Fermeture...';
      
        // On essaie la déconnexion serveur, mais on déconnecte LOCALEMENT quoi qu'il arrive
        try {
          await btApi.delete("/agent/delete-account");
        } catch (error) {
          // 🔧 Si le backend renvoie une erreur (ex: compte déjà désactivé),
          // on continue quand même la déconnexion locale
          console.warn("Backend logout warning:", error);
        }
        
        // 🔒 TOUJOURS effacer le token et rediriger
        btAuth.logout();
        sessionStorage.clear();
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
